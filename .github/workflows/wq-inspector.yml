name: Validate WQ push inspector
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate privacy, field formats and read-only behavior
        run: node tools/test-wq-push-inspector.cjs
      - name: Package WQ Files inspector
        run: |
          mkdir -p build
          cd tools/wq-push-inspector
          zip -q ../../build/Douyin-WQ-Push-Inspector.zip manifest.json inspect.js README.zh-CN.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Douyin-WQ-Push-Inspector
          path: build/Douyin-WQ-Push-Inspector.zip
          if-no-files-found: error
